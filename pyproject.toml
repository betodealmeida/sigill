[project]
name = "sigill"
version = "0.1.0"
description = "Sigill prevents unauthorized SQL. Sigill only understand SQL."
authors = [{name = "Robida", email = "contact@robida.net"},]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.24.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 98

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
]
